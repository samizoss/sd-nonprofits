# Layer 1: canonical sources. Links only, never copied text.
#
# Every source carries three anchors:
#   stable_id  - the real citation; survives URL changes and names the version relied on
#   live_url   - convenience link to the current version
#   pin        - what you relied on, frozen (filled in by the watcher on first run)
#
# Fields
#   kind:      irs_pdf | web | ecfr | asu_feed | book
#   watch:     annual | asu | occasional | static
#              (annual = expect a new version every year; asu = changes only via a new FASB ASU;
#               occasional = revised irregularly; static = effectively frozen)
#   verified:  primary   - checked against the issuing body's own text
#              secondary - checked against 2+ independent professional sources (CPA firms, law firms),
#                          primary text not yet read in this repo
#              pending   - not yet verified; treat as a lead, not a rule
#   last_verified: date a human (or Claude, reviewed by a human) last checked the claim
#   public_domain: true when the document may be stored in snapshots/ (US federal works)
#
# The watcher (watcher/watch.py) reads this file. Decision files point here by `id`.

sources:

