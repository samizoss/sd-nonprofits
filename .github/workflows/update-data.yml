name: Update Dashboard Data

on:
  schedule:
    - cron: '0 11 * * 1'   # Mondays 11:00 UTC = 6 AM Central (5 AM in winter)
  workflow_dispatch:       # "Run workflow" button on the Actions tab
    inputs:
      skip_guard:
        description: 'Publish even if counts dropped more than 10% (only if the drop is real)'
        type: boolean
        default: false

# Lets the bot save the refreshed data. Without this, git push fails (exit 128),
# which is why the May/June/July 2026 runs never published anything.
permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Fetch organizations
        run: node scripts/fetch-orgs.js

      - name: Fetch financial details
        run: node scripts/fetch-financials.js

      - name: Process dashboard data
        run: node scripts/process-data.js

      # Stops before publishing if org or financials counts fell more than 10%
      # (e.g. ProPublica outage). The live site keeps last week's data and
      # GitHub emails you that the run failed.
      - name: Safety check before publishing
        if: ${{ !inputs.skip_guard }}
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from 'fs';
          import { execSync } from 'child_process';
          const FILE = 'src/data/dashboard-data.json';
          const next = JSON.parse(readFileSync(FILE, 'utf-8'));
          let prev = null;
          try { prev = JSON.parse(execSync(`git show HEAD:${FILE}`, { maxBuffer: 256 * 1024 * 1024 }).toString()); } catch {}
          const problems = [];
          if (!next.overview?.total_orgs || !next.orgs?.length) problems.push('New data is empty or malformed.');
          for (const key of ['total_orgs', 'with_financials']) {
            const before = prev?.overview?.[key], after = next.overview?.[key];
            if (typeof before !== 'number' || !before) continue;
            const change = (after - before) / before;
            console.log(`${key}: ${before} -> ${after} (${(change * 100).toFixed(1)}%)`);
            if (change < -0.10) problems.push(`${key} dropped ${(-change * 100).toFixed(1)}% (${before} -> ${after})`);
          }
          if (problems.length) { console.error('Not publishing:\n - ' + problems.join('\n - ')); process.exit(1); }
          console.log('Safety check passed.');
          JS

      - name: Make sure the site still builds
        run: npm run build

      # Every run stamps a new "last updated" time, so there is a commit every week.
      # That keeps the repo active, which stops GitHub from auto-disabling the
      # schedule after 60 quiet days. Vercel redeploys from this commit.
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/dashboard-data.json
          git diff --staged --quiet && { echo "No changes."; exit 0; }
          git commit -m "data: weekly refresh $(date -u +%Y-%m-%d)"
          git push
