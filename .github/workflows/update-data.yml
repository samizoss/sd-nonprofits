name: Update Dashboard Data

on:
  schedule:
    - cron: '0 11 * * 1'   # Mondays 11:00 UTC = 6 AM Central (5 AM in winter)
  workflow_dispatch:       # "Run workflow" button on the Actions tab
    inputs:
      skip_guard:
        description: 'Publish even if counts dropped more than 10% (only if the drop is real)'
        type: boolean
        default: false

# Lets the bot save the refreshed data back to the repo.
permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

env:
  STATES: SD,MN   # every state listed here gets rebuilt; add one in scripts/states.js too

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      # IRS org lists (monthly), IRS 990 financial extracts, Census populations
      - name: Download IRS and Census source files
        run: node scripts/fetch-irs.js

      - name: Build per-state inputs
        run: node scripts/build-raw.js

      - name: Process dashboard data
        run: |
          for st in ${STATES//,/ }; do STATE=$st node scripts/process-data.js; done

      - name: Safety check before publishing
        if: ${{ !inputs.skip_guard }}
        run: node scripts/check-data.js

      - name: Make sure every site still builds
        run: |
          for st in ${STATES//,/ }; do VITE_STATE=$st npx vite build --outDir dist-$st; done

      # Every run stamps a new "last updated" time, so there is a commit every week.
      # That keeps the repo active (GitHub disables schedules after 60 quiet days).
      # Each state's Vercel project redeploys from this commit.
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/*.json
          git diff --staged --quiet && { echo "No changes."; exit 0; }
          git commit -m "data: weekly refresh $(date -u +%Y-%m-%d)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
