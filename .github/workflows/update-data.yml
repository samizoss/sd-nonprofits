name: Update Dashboard Data

on:
  schedule:
    - cron: '0 6 1 * *'  # 6 AM UTC on 1st of each month
  workflow_dispatch: {}     # manual trigger

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm ci

      - name: Fetch organizations
        run: node scripts/fetch-orgs.js

      - name: Fetch financial details
        run: node scripts/fetch-financials.js

      - name: Process dashboard data
        run: node scripts/process-data.js

      - name: Commit and push if data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/dashboard-data.json
          git diff --staged --quiet || git commit -m "data: update dashboard data $(date +%Y-%m-%d)"
          git push
